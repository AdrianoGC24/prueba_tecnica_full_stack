name: Continuous Integration - Mining Motors Monorepo

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  # ============================================================================
  # 1. CI: Auth Service (Node.js + Express + TypeScript)
  # ============================================================================
  auth-service-ci:
    name: Auth Service (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './auth-service/package.json'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar compilación TypeScript
        run: npm run build

      - name: Ejecutar pruebas unitarias y de integración (Jest)
        run: npm test

  # ============================================================================
  # 2. CI: Business Service (Python + FastAPI + Pytest)
  # ============================================================================
  business-service-ci:
    name: Business Service (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./business-service

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './business-service/requirements.txt'

      - name: Instalar dependencias del servicio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas con Pytest (SQLite in-memory)
        run: PYTHONPATH=. pytest tests/test_business.py -v

  # ============================================================================
  # 3. CI: Frontend (React + TypeScript + Vite)
  # ============================================================================
  frontend-ci:
    name: Frontend (Build & Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar compilación de producción con Vite
        run: npm run build

  # ============================================================================
  # 4. CI: Verificación de Construcción de Contenedores Docker
  # ============================================================================
  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [auth-service-ci, business-service-ci, frontend-ci]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker - auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: false

      - name: Build imagen Docker - business-service
        uses: docker/build-push-action@v5
        with:
          context: ./business-service
          file: ./business-service/Dockerfile
          push: false

      - name: Build imagen Docker - frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
